<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava</title>
  <style>
    :root {
      --bg: #e9eef2;
      --card: #ffffff;
      --text: #1b2630;
      --muted: #5b6b78;
      --line: #c5d0d8;
      --accent: #1f5f8b;
      --accent-dark: #174a6d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .login {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2rem;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
    label { display: block; margin-bottom: .35rem; font-size: .9rem; color: var(--muted); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: .65rem .75rem;
      margin-bottom: 1.1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #8ec1e3;
      outline-offset: 1px;
    }
    .show { display: flex; align-items: center; gap: .5rem; margin: -.4rem 0 1.25rem; font-size: .9rem; color: var(--muted); }
    .show label { margin: 0; }
    button {
      width: 100%;
      padding: .75rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    #sporocilo { min-height: 1.3em; margin: 1rem 0 0; font-size: .9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="login">
    <h1>Prijava</h1>
    <form id="prijava" autocomplete="on">
      <label for="username">Uporabniško ime</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Geslo</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <div class="show">
        <input type="checkbox" id="pokazi">
        <label for="pokazi">Pokaži geslo</label>
      </div>

      <button type="submit">Prijavi se</button>
      <p id="sporocilo" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("prijava");
    const geslo = document.getElementById("password");
    const sporocilo = document.getElementById("sporocilo");

    document.getElementById("pokazi").addEventListener("change", function () {
      geslo.type = this.checked ? "text" : "password";
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      // Tukaj bi podatke poslali na strežnik, npr. z fetch().
      sporocilo.textContent = "Vnos prejet: " + form.username.value;
    });
  </script>
</body>
</html>
